<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>פותחים את האפליקציה</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#10151c;color:#f3f5f8;font:17px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;text-align:center}
main{max-width:340px;padding:24px}h1{font-size:20px;margin:0 0 10px}p{margin:0 0 18px;color:#c3cad4;word-break:break-word}
a.go{display:inline-block;min-width:200px;padding:13px 22px;border-radius:26px;background:#33CCFF;color:#0b1d26;font-weight:800;text-decoration:none}
a.go.tel{background:#1E8E3E;color:#fff}small{display:block;margin-top:22px;color:#7f8a99;font-size:13px}
</style>
</head>
<body>
<main>
<h1 id="t">דף מעבר לחוברות הטיול</h1>
<p id="l">הדף הזה פותח את Waze ואת החייגן מתוך חוברות הטיול. חוזרים לחוברת.</p>
<a id="b" class="go" href="#" hidden>לפתיחת Waze</a>
<small>הוכן ע״י קאיד קואס</small>
</main>
<script>
/* Hand-off from a trip booklet to an app on the phone.
   ?ll=LAT,LNG or ?q=place  -> waze://?...&navigate=yes
   ?k=tel&n=+972...         -> tel:...
   Only these two targets are ever built, from checked values. Nothing from the address is passed through as-is. */
(function(){
  var sp=new URLSearchParams(location.search),k=(sp.get("k")||"waze").toLowerCase(),url=null,label="",tel=false;
  if(k==="tel"){var n=(sp.get("n")||"").replace(/[\s\-().]/g,"");if(/^\+?\d{3,16}$/.test(n)){url="tel:"+n;label=n;tel=true;}}
  else if(k==="waze"){
    var ll=(sp.get("ll")||"").replace(/\s/g,"");
    if(ll){if(/^-?\d{1,2}(\.\d{1,8})?,-?\d{1,3}(\.\d{1,8})?$/.test(ll)){var p=ll.split(",");if(Math.abs(+p[0])<=90&&Math.abs(+p[1])<=180){url="waze://?ll="+ll+"&navigate=yes";label=ll;}}}
    else{var q=(sp.get("q")||"").trim();if(q&&q.length<=200&&!/[\u0000-\u001f]/.test(q)){url="waze://?q="+encodeURIComponent(q)+"&navigate=yes";label=q;}}
  }
  if(!location.search)return;
  var t=document.getElementById("t"),l=document.getElementById("l"),b=document.getElementById("b");
  if(!url){t.textContent="הקישור לא תקין";l.textContent="חזרו לחוברת ונסו שוב מהכפתור.";return;}
  t.textContent=tel?"חיוג":"פותחים את Waze";l.textContent=label;l.dir="auto";
  b.href=url;b.textContent=tel?"לחיוג":"לפתיחת Waze";if(tel)b.className="go tel";b.hidden=false;
  setTimeout(function(){location.replace(url);},60);
})();
</script>
</body>
</html>
